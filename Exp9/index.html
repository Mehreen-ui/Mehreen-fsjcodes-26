<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Automatic Background Color</title>
</head>

<body style="text-align: center; background-color: aquamarine;">

    <h1>Welcome to My Website</h1>
    <h2>I am Mehreen</h2>
    <h2>This website changes color every 5 Seconds!!!!</h2>

    <script>
        function changeBackground() {
            let colors = [
                "yellow",
                "blue",
                "olive",
                "#674534",
                "#128a32",
                "red",
                "orange",
                "purple",
                "pink",
                "green",
                "cyan",
                "magenta",
                "brown",
                "gold",
                "coral"
            ];

            const bodyEle = document.querySelector("body");

            let randomIdx = Math.floor(Math.random() * colors.length);

            bodyEle.style.backgroundColor = colors[randomIdx];
        }

        // Changes background color automatically every 5 seconds
        setInterval(() => {
            changeBackground();
        }, 1000);
    </script>

</body>

</html>
